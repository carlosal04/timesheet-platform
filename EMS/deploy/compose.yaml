services:
  reverse-proxy:
    image: cgr.dev/chainguard/nginx@sha256:770994a6d14bfd17a34fcf0503e13f5f7c4cf6327b0ec6636f4607cb7dd91afc
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8088:8080"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "/usr/bin/nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: src/TimeSheet.Modules.EmploymentManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EmploymentManagement: Host=postgres;Port=5432;Database=${EMS_DB_NAME:-ems};Username=${EMS_DB_USER:-ems};Password=${EMS_DB_PASSWORD}
      BootstrapAdmin__Email: ${EMS_BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${EMS_BOOTSTRAP_ADMIN_PASSWORD:-}
      BootstrapAdmin__Name: ${EMS_BOOTSTRAP_ADMIN_NAME:-Bootstrap Admin}
      Email__FromAddress: ${EMS_EMAIL_FROM_ADDRESS:-no-reply@ems.local}
      Email__FromDisplayName: ${EMS_EMAIL_FROM_DISPLAY_NAME:-Employment Management System}
      Email__Smtp__Host: ${EMS_SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${EMS_SMTP_PORT:-1025}
      Email__Smtp__SecurityMode: ${EMS_SMTP_SECURITY_MODE:-None}
      Email__Smtp__Username: ${EMS_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMS_SMTP_PASSWORD:-}
      DataProtection__KeysPath: /var/lib/ems/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - data-protection-keys:/var/lib/ems/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../..
      dockerfile: EMS/deploy/frontend/Dockerfile
    healthcheck:
      test: ["CMD", "/usr/bin/nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: cgr.dev/chainguard/postgres@sha256:5306d83b500d1275fae83e5790d8790ccda93cf1622f831122412909b1db3f8d
    environment:
      POSTGRES_DB: ${EMS_DB_NAME:-ems}
      POSTGRES_USER: ${EMS_DB_USER:-ems}
      POSTGRES_PASSWORD: ${EMS_DB_PASSWORD}
    ports:
      - "${EMS_DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMS_DB_USER:-ems} -d ${EMS_DB_NAME:-ems}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit@sha256:c5a6d0ba4d08187f70f305471da5fd9ad424fdfc2f25a2308226a786335dfa9f
    ports:
      - "${EMS_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  data-protection-keys:
