services:
  reverse-proxy:
    image: cgr.dev/chainguard/nginx:latest
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8088:8080"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "/usr/bin/nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: src/TimeSheet.Modules.EmploymentManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EmploymentManagement: Host=postgres;Port=5432;Database=${EMS_DB_NAME:-ems};Username=${EMS_DB_USER:-ems};Password=${EMS_DB_PASSWORD}
      BootstrapAdmin__Email: ${EMS_BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${EMS_BOOTSTRAP_ADMIN_PASSWORD:-}
      BootstrapAdmin__Name: ${EMS_BOOTSTRAP_ADMIN_NAME:-Bootstrap Admin}
      DataProtection__KeysPath: /var/lib/ems/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - data-protection-keys:/var/lib/ems/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    healthcheck:
      test: ["CMD", "/usr/bin/nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${EMS_DB_NAME:-ems}
      POSTGRES_USER: ${EMS_DB_USER:-ems}
      POSTGRES_PASSWORD: ${EMS_DB_PASSWORD}
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  data-protection-keys:
